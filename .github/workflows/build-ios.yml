name: iOS IPA Build (EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil de compilación EAS (eas.json)"
        required: true
        default: "preview"
        type: choice
        options:
          - "preview"
          - "development"
          - "production"
  push:
    branches:
      - main

jobs:
  build-ipa:
    name: Build iOS IPA with EAS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Falta el GitHub Secret 'EXPO_TOKEN'."
            echo "Por favor genera un token en https://expo.dev/settings/access-tokens y agrégalo en Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "EXPO_TOKEN detectado. Verificando sesión EAS..."
          eas whoami

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Trigger EAS Build for iOS
        id: eas-build
        run: |
          SELECTED_PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          echo "Iniciando compilación en EAS para iOS con perfil: $SELECTED_PROFILE"

          # Ejecutar EAS Build en modo no interactivo y esperar al artefacto
          eas build \
            --platform ios \
            --profile "$SELECTED_PROFILE" \
            --non-interactive \
            --wait \
            --json > build-output.json

          # Extraer URL del artefacto IPA
          IPA_URL=$(node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("build-output.json", "utf8");
            const data = JSON.parse(raw);
            const buildObj = Array.isArray(data) ? data[0] : data;
            const url = (buildObj.artifacts && (buildObj.artifacts.buildUrl || buildObj.artifacts.applicationArchiveUrl)) || buildObj.buildUrl;
            if (!url) {
              console.error("No se encontró URL de descarga en la respuesta de EAS:", raw);
              process.exit(1);
            }
            console.log(url);
          ')

          echo "ipa_url=$IPA_URL" >> "$GITHUB_OUTPUT"
          echo "Compilación completada. URL de descarga obtenida."

      - name: Download generated IPA
        run: |
          mkdir -p build/ipa
          echo "Descargando IPA desde EAS..."
          curl -L -o build/ipa/NetworkingApp.ipa "${{ steps.eas-build.outputs.ipa_url }}"

          # Validar que el archivo se haya descargado y no esté vacío
          if [ ! -s build/ipa/NetworkingApp.ipa ]; then
            echo "::error::El archivo IPA descargado está vacío o no es válido."
            exit 1
          fi
          echo "IPA descargada exitosamente:"
          ls -lh build/ipa/NetworkingApp.ipa

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: NetworkingApp-iOS
          path: build/ipa/NetworkingApp.ipa
          if-no-files-found: error
          retention-days: 14
