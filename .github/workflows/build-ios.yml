name: iOS IPA Build (GitHub)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil de compilación EAS (eas.json)"
        required: true
        default: "preview"
        type: choice
        options:
          - "preview"
          - "development"
          - "production"
  push:
    branches:
      - main

jobs:
  build-ipa:
    name: Build iOS IPA with EAS
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::Falta el GitHub Secret 'EXPO_TOKEN'."
            exit 1
          fi

          echo "EXPO_TOKEN detectado. Verificando sesión EAS..."
          eas whoami

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build IPA locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          SELECTED_PROFILE="${{ github.event.inputs.profile || 'preview' }}"

          echo "Iniciando compilación local de iOS en GitHub"
          echo "Perfil: $SELECTED_PROFILE"

          mkdir -p build/ipa

          eas build \
            --platform ios \
            --profile "$SELECTED_PROFILE" \
            --local \
            --non-interactive \
            --freeze-credentials \
            --output ./build/ipa/NetworkingApp.ipa

      - name: Verify IPA
        run: |
          if [ ! -s build/ipa/NetworkingApp.ipa ]; then
            echo "::error::El archivo IPA no fue generado o es inválido."
            exit 1
          fi

          echo "IPA generada exitosamente:"
          ls -lh build/ipa/NetworkingApp.ipa

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: NetworkingApp-iOS
          path: build/ipa/NetworkingApp.ipa
          if-no-files-found: error
          retention-days: 14
