name: iOS IPA Build (GitHub)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil de compilación EAS (eas.json)"
        required: true
        default: "preview"
        type: choice
        options:
          - "preview"
          - "development"
          - "production"
  push:
    branches:
      - build-ios-github

jobs:
  build-ipa:
    name: Build iOS IPA with EAS Local
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Environment Diagnostics
        run: |
          echo "==================== DIAGNÓSTICO PREVIO ===================="
          echo "macOS: $(sw_vers -productName) $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
          echo "Xcode activo: $(xcodebuild -version | tr '\n' ' ')"
          echo "xcode-select: $(xcode-select -p)"
          echo "iOS SDK: $(xcrun --show-sdk-path --sdk iphoneos 2>/dev/null || echo 'No detectado')"
          echo "Node: $(node --version 2>/dev/null || echo 'No disponible')"
          echo "EAS CLI: $(eas --version 2>/dev/null || echo 'No disponible')"
          echo "============================================================"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::Falta el GitHub Secret 'EXPO_TOKEN'."
            exit 1
          fi
          echo "EXPO_TOKEN detectado. Verificando sesión EAS..."
          eas whoami

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build IPA locally with EAS
        id: eas-build-local
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          SELECTED_PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          echo "Iniciando compilación local de iOS con perfil: $SELECTED_PROFILE"

          mkdir -p build/ipa

          set +e
          eas build \
            --platform ios \
            --profile "$SELECTED_PROFILE" \
            --local \
            --non-interactive \
            --freeze-credentials \
            --output ./build/ipa/NetworkingApp.ipa 2>&1 | tee build-local.log
          BUILD_EXIT_CODE="${PIPESTATUS[0]}"
          set -e

          if [ "$BUILD_EXIT_CODE" -ne 0 ]; then
            echo "::error::EAS Local Build falló con código de salida $BUILD_EXIT_CODE."
            echo "==================== LOG DE COMPILACIÓN ===================="
            cat build-local.log
            echo "============================================================"
            exit "$BUILD_EXIT_CODE"
          fi

      - name: Verify IPA Artifact
        run: |
          if [ ! -s build/ipa/NetworkingApp.ipa ]; then
            echo "::error::El archivo IPA no fue generado o está vacío en build/ipa/NetworkingApp.ipa."
            exit 1
          fi
          echo "IPA generada exitosamente:"
          ls -lh build/ipa/NetworkingApp.ipa

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: NetworkingApp-iOS
          path: build/ipa/NetworkingApp.ipa
          if-no-files-found: error
          retention-days: 14
