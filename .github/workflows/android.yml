name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ============================================================
# Configuración de formatos a compilar
# Para activar/desactivar un formato, cambiar a "true" o "false"
# ============================================================
env:
  BUILD_AAB: "true"
  BUILD_APK: "false"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK + AAB with Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        if: env.BUILD_AAB == 'true' || env.BUILD_APK == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: env.BUILD_AAB == 'true' || env.BUILD_APK == 'true'
        run: npm ci --legacy-peer-deps

      - name: Setup Java 17
        if: env.BUILD_AAB == 'true' || env.BUILD_APK == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        if: env.BUILD_AAB == 'true' || env.BUILD_APK == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        if: env.BUILD_AAB == 'true' || env.BUILD_APK == 'true'
        run: chmod +x android/gradlew

      # ============================================================
      # Configuración de firma de producción (Keystore)
      # ============================================================

      - name: Decode Android Release Keystore
        if: env.BUILD_AAB == 'true' || env.BUILD_APK == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/release.keystore"

      # ============================================================
      # AAB — Google Play
      # ============================================================

      - name: Build Android Release AAB
        if: env.BUILD_AAB == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/keystore/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:bundleRelease

      - name: Upload AAB Artifact
        if: env.BUILD_AAB == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NetworkingApp-Android-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # APK — Pruebas en dispositivo
      # ============================================================

      - name: Build Android Release APK
        if: env.BUILD_APK == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/keystore/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:assembleRelease

      - name: Upload APK Artifact
        if: env.BUILD_APK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NetworkingApp-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # Resumen
      # ============================================================

      - name: Build Summary
        run: |
          echo "==================== ANDROID BUILD RESUMEN ===================="
          echo "BUILD_AAB: ${{ env.BUILD_AAB }}"
          echo "BUILD_APK: ${{ env.BUILD_APK }}"
          if [ "${{ env.BUILD_AAB }}" = "true" ]; then
            echo "AAB: ACTIVADO -> Generado en android/app/build/outputs/bundle/release/app-release.aab"
          else
            echo "AAB: DESACTIVADO -> Paso omitido"
          fi
          if [ "${{ env.BUILD_APK }}" = "true" ]; then
            echo "APK: ACTIVADO -> Generado en android/app/build/outputs/apk/release/app-release.apk"
          else
            echo "APK: DESACTIVADO -> Paso omitido"
          fi
          echo "================================================================"
