name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK + AAB with Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # ============================================================
      # AAB — Google Play
      # ============================================================

      - name: Build Android Release AAB
        run: |
          cd android
          ./gradlew :app:bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkingApp-Android-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # APK — Pruebas en dispositivo
      # ============================================================

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkingApp-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # Resumen
      # ============================================================

      - name: Build Summary
        run: |
          echo "==================== ANDROID BUILD COMPLETADO ===================="
          echo "Compilación nativa con Gradle completada con éxito."
          echo "AAB generado en: android/app/build/outputs/bundle/release/app-release.aab"
          echo "APK generado en: android/app/build/outputs/apk/release/app-release.apk"
          echo "Artefactos disponibles:"
          echo " - NetworkingApp-Android-AAB"
          echo " - NetworkingApp-Android-APK"
          echo "Retención de artefactos: 14 días"
          echo "==================================================================="
