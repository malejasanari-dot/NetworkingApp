name: Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil de compilación EAS (eas.json)"
        required: true
        default: "production"
        type: choice
        options:
          - "production"
          - "preview"

jobs:
  build-android:
    name: Build Android APK + AAB with EAS Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::Falta el GitHub Secret 'EXPO_TOKEN'."
            exit 1
          fi

          echo "EXPO_TOKEN detectado."
          eas whoami

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ============================================================
      # AAB — Google Play
      # ============================================================

      - name: Build AAB with EAS Cloud
        id: eas-aab
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          SELECTED_PROFILE="${{ github.event.inputs.profile || 'production' }}"

          echo "Generando AAB con perfil: $SELECTED_PROFILE"

          BUILD_OUTPUT=$(eas build \
            --platform android \
            --profile "$SELECTED_PROFILE" \
            --non-interactive \
            --json 2>&1)

          echo "$BUILD_OUTPUT"

          ARTIFACT_URL=$(echo "$BUILD_OUTPUT" \
            | grep -o '"buildUrl":"[^"]*"' \
            | head -1 \
            | sed 's/"buildUrl":"//;s/"//')

          if [ -z "$ARTIFACT_URL" ]; then
            echo "::error::No se pudo obtener la URL del AAB."
            exit 1
          fi

          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

      - name: Download AAB
        run: |
          mkdir -p build/aab

          curl -L \
            -o build/aab/NetworkingApp.aab \
            "${{ steps.eas-aab.outputs.artifact_url }}"

          if [ ! -s build/aab/NetworkingApp.aab ]; then
            echo "::error::El AAB no fue descargado correctamente."
            exit 1
          fi

          ls -lh build/aab/NetworkingApp.aab

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkingApp-Android-AAB
          path: build/aab/NetworkingApp.aab
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # APK — Pruebas en dispositivo
      # ============================================================

      - name: Build APK with EAS Cloud
        id: eas-apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Generando APK con perfil preview..."

          BUILD_OUTPUT=$(eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json 2>&1)

          echo "$BUILD_OUTPUT"

          ARTIFACT_URL=$(echo "$BUILD_OUTPUT" \
            | grep -o '"buildUrl":"[^"]*"' \
            | head -1 \
            | sed 's/"buildUrl":"//;s/"//')

          if [ -z "$ARTIFACT_URL" ]; then
            echo "::error::No se pudo obtener la URL del APK."
            exit 1
          fi

          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: |
          mkdir -p build/apk

          curl -L \
            -o build/apk/NetworkingApp.apk \
            "${{ steps.eas-apk.outputs.artifact_url }}"

          if [ ! -s build/apk/NetworkingApp.apk ]; then
            echo "::error::El APK no fue descargado correctamente."
            exit 1
          fi

          ls -lh build/apk/NetworkingApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkingApp-Android-APK
          path: build/apk/NetworkingApp.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # Resumen
      # ============================================================

      - name: Build Summary
        run: |
          echo "==================== ANDROID BUILD COMPLETADO ===================="
          echo "AAB: NetworkingApp-Android-AAB"
          echo "APK: NetworkingApp-Android-APK"
          echo "AAB: listo para Google Play Console"
          echo "APK: listo para pruebas en dispositivos Android"
          echo "Retención: 14 días"
          echo "==================================================================="
