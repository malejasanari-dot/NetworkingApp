name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android if folder does not exist
        run: |
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --non-interactive
          else
            echo "La carpeta 'android' ya existe. Omitiendo prebuild."
          fi

      - name: Build Release APK
        env:
          NODE_ENV: production
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify generated APK directory
        run: ls -R android/app/build/outputs/apk/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyNetworkingApp-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Print exact APK path
        run: echo "android/app/build/outputs/apk/release/app-release.apk"
