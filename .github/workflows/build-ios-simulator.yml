name: iOS Simulator Build (GitHub)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator
  cancel-in-progress: false

jobs:
  build-simulator:
    name: Build iOS Simulator with EAS Local
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Falta el secreto EXPO_TOKEN en GitHub."
            exit 1
          fi
          echo "EXPO_TOKEN detectado. Verificando sesión EAS..."
          eas whoami

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate simulator profile in eas.json
        run: |
          echo "Validando configuración de eas.json para simulador..."
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('./eas.json')) {
              console.error('::error::No se encontró el archivo eas.json en la raíz del proyecto.');
              process.exit(1);
            }
            const eas = JSON.parse(fs.readFileSync('./eas.json', 'utf8'));
            if (!eas.build) {
              console.error('::error::Falta la sección \"build\" en eas.json.');
              process.exit(1);
            }
            if (!eas.build.simulator) {
              console.error('::error::Falta el perfil \"build.simulator\" en eas.json.');
              process.exit(1);
            }
            if (eas.build.simulator?.ios?.simulator !== true) {
              console.error('::error::Falta \"build.simulator.ios.simulator: true\" en eas.json.');
              process.exit(1);
            }
            console.log('✓ Validación exitosa: build.simulator.ios.simulator=true en eas.json');
          "

      - name: Build simulator app with EAS Local
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_USE_PRECOMPILED_MODULES: "0"
          EXPO_PUBLIC_API_URL: https://networking-app-backend-e80t.onrender.com
        run: |
          mkdir -p build/simulator
          OUTPUT_PATH="./build/simulator/NetworkingApp-Simulator.tar.gz"
          LOG_PATH="build-simulator.log"

          echo "============================================================"
          echo "Iniciando compilación local para iOS Simulator"
          echo "Perfil obligatorio: simulator"
          echo "EXPO_USE_PRECOMPILED_MODULES=$EXPO_USE_PRECOMPILED_MODULES"
          echo "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL"
          echo "============================================================"

          MAX_ATTEMPTS=2
          ATTEMPT=1
          SUCCESS=false

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo ""
            echo "============================================================"
            echo "Ejecutando intento de compilación $ATTEMPT de $MAX_ATTEMPTS"
            echo "============================================================"

            rm -f "$OUTPUT_PATH"

            set +e
            eas build \
              --platform ios \
              --profile simulator \
              --local \
              --non-interactive \
              --output "$OUTPUT_PATH" \
              2>&1 | tee "$LOG_PATH"
            BUILD_EXIT_CODE="${PIPESTATUS[0]}"
            set -e

            if [ "$BUILD_EXIT_CODE" -eq 0 ]; then
              echo "✓ Compilación del simulador completada exitosamente en el intento $ATTEMPT."
              SUCCESS=true
              break
            fi

            echo "::warning::El intento $ATTEMPT falló con código de salida $BUILD_EXIT_CODE."

            # Verificar si el fallo fue por un error explícito de red, transporte, timeout o descarga de Maven/CocoaPods
            IS_NETWORK_ERROR=false
            if grep -Ei "(curl: \((56|28|35|6|7)\)|Recv failure|Connection reset by peer|Operation timed out|Connection timed out|Could not resolve host|Failed to connect to|SSL_ERROR_SYSCALL|HTTP/2 stream .* was not closed cleanly|Failed to download.*from.*maven)" "$LOG_PATH" > /dev/null; then
              IS_NETWORK_ERROR=true
            fi

            if [ "$IS_NETWORK_ERROR" = true ] && [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              WAIT_SECONDS=30
              echo "::warning::Detectado error temporal de red o transporte en Maven/CocoaPods."
              echo "Esperando $WAIT_SECONDS segundos antes de reintentar (intento $((ATTEMPT + 1)) de $MAX_ATTEMPTS)..."
              sleep "$WAIT_SECONDS"
              ATTEMPT=$((ATTEMPT + 1))
            else
              if [ "$IS_NETWORK_ERROR" = false ]; then
                echo "::error::La compilación falló por un error de código, configuración o compilador. No se realizarán reintentos."
              else
                echo "::error::Se agotaron los reintentos permitidos ($MAX_ATTEMPTS) tras fallos de red persistentes de Maven."
              fi
              break
            fi
          done

          if [ "$SUCCESS" != true ]; then
            echo "::error::Falló la compilación del simulador de iOS."
            exit "$BUILD_EXIT_CODE"
          fi

      - name: Verify simulator artifact
        run: |
          ARCHIVE="build/simulator/NetworkingApp-Simulator.tar.gz"

          if [ ! -s "$ARCHIVE" ]; then
            echo "::error::No se generó el archivo del simulador o está vacío en $ARCHIVE."
            exit 1
          fi

          echo "Tamaño del archivo comprimido:"
          ls -lh "$ARCHIVE"

          echo "Contenido del archivo (primeras 30 entradas):"
          tar -tzf "$ARCHIVE" | head -30

          if ! tar -tzf "$ARCHIVE" | grep -q '\.app/'; then
            echo "::error::No se encontró una aplicación .app dentro del archivo $ARCHIVE."
            exit 1
          fi

          echo "✓ Verificación exitosa: Archivo .tar.gz contiene la aplicación .app para simulador."

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetworkingApp-Simulator-Build-Log
          path: build-simulator.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload simulator artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NetworkingApp-iOS-Simulator
          path: build/simulator/NetworkingApp-Simulator.tar.gz
          if-no-files-found: error
          retention-days: 14
