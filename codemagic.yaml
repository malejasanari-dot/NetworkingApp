workflows:
  ios-expo-development:
    name: iOS Expo Development Build (Signed IPA)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.anonymous.personalnetworkingapp
      vars:
        EXPO_PUBLIC_SUPABASE_URL: $EXPO_PUBLIC_SUPABASE_URL
        EXPO_PUBLIC_SUPABASE_ANON_KEY: $EXPO_PUBLIC_SUPABASE_ANON_KEY
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
    scripts:
      - name: Environment Diagnostics
        script: |
          echo "=== Environment Info ==="
          node --version
          npm --version
          xcodebuild -version
          pod --version

      - name: Install npm dependencies
        script: |
          echo "=== Installing npm dependencies ==="
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Expo Prebuild (Generate temporary iOS project)
        script: |
          echo "=== Running Expo Prebuild for iOS ==="
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        script: |
          echo "=== Installing CocoaPods ==="
          cd ios
          pod install

      - name: Set up code signing
        script: |
          echo "=== Setting up Xcode Code Signing Profiles ==="
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          echo "=== Compiling signed iOS IPA ==="
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | node -e '
            const fs = require("fs");
            const input = JSON.parse(fs.readFileSync(0, "utf-8"));
            const target = input.project.targets[0] || input.project.name;
            console.log(target);
          ')
          echo "Detected workspace: $WORKSPACE"
          echo "Detected scheme: $SCHEME"

          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_*.log
      - $HOME/Library/Logs/Codemagic/**/*.log
